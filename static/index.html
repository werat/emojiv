<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>emojiv</title>
    <style>
      :root {
        --bg: #fafafa;
        --fg: #1d1d1f;
        --muted: #6e6e73;
        --card: #fff;
        --border: #e2e2e6;
        --accent: #3b6fe0;
        --bar: #c9d8fb;
        --err: #c62828;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161618;
          --fg: #ececf0;
          --muted: #9a9aa2;
          --card: #1f1f23;
          --border: #33333a;
          --accent: #7aa2ff;
          --bar: #2e3f6b;
          --err: #ff6b6b;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px 16px;
        background: var(--bg);
        color: var(--fg);
        font:
          15px/1.45 system-ui,
          -apple-system,
          sans-serif;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 16px;
      }
      .controls {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }
      #q {
        flex: 1 1 320px;
        font-size: 20px;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--card);
        color: var(--fg);
      }
      #q:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }
      label {
        color: var(--muted);
        font-size: 13px;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      select {
        padding: 4px;
        background: var(--card);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      input[type="number"] {
        width: 60px;
        padding: 4px;
        background: var(--card);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      #status {
        margin: 10px 0;
        min-height: 20px;
        color: var(--muted);
        font-size: 13px;
      }
      #status.error {
        color: var(--err);
      }
      #results {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 8px 0 24px;
        min-height: 96px;
      }
      .tile {
        width: 84px;
        padding: 8px 4px;
        text-align: center;
        cursor: pointer;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      .tile:hover {
        border-color: var(--accent);
      }
      .tile .e {
        font-size: 40px;
        line-height: 1.2;
      }
      .tile .p {
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .tile .n {
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #debug {
        border-top: 1px solid var(--border);
        padding-top: 12px;
      }
      #debug h2 {
        font-size: 15px;
        margin: 18px 0 8px;
      }
      .meta {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 6px 16px;
        font-size: 13px;
      }
      .meta b {
        color: var(--muted);
        font-weight: 500;
        margin-right: 4px;
      }
      .table-wrap {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      th,
      td {
        text-align: left;
        padding: 4px 8px;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }
      th {
        color: var(--muted);
        font-weight: 500;
      }
      td.num {
        text-align: right;
      }
      td.bar {
        width: 30%;
        min-width: 120px;
      }
      .barfill {
        height: 10px;
        background: var(--bar);
        border-radius: 3px;
      }
      pre {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        overflow: auto;
        max-height: 480px;
        font-size: 12px;
      }
      a {
        color: var(--accent);
      }
      .hint {
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>emojiv — emoji picker powered by Jev</h1>
      <div class="controls">
        <input
          id="q"
          type="text"
          placeholder=":movie-about-dinosaurs"
          autocomplete="off"
          autofocus
        />
        <label>backend <select id="backend"></select></label>
        <label
          >top N <input id="n" type="number" min="1" max="100" value="10"
        /></label>
        <label><input id="show-debug" type="checkbox" checked /> debug</label>
        <label><input id="show-raw" type="checkbox" /> raw Jev response</label>
      </div>
      <div id="status"></div>
      <div id="results"></div>

      <section id="debug">
        <div class="meta" id="meta"></div>

        <h2>Top emoji</h2>
        <p class="hint" id="score-hint"></p>
        <div class="table-wrap"><table id="results-table"></table></div>

        <div id="jev-only">
        <h2>Categories</h2>
        <p class="hint">
          P(related) from each category's <code>related:*</code> Noul question
          (independent, not a distribution), with the best emoji from its
          <code>bucket:*</code> Choice question.
        </p>
        <div class="table-wrap"><table id="buckets-table"></table></div>

        <h2>Request</h2>
        <p class="hint">
          <a id="request-link" href="/api/request" target="_blank"
            >View the Jev request body for this query</a
          >
        </p>

        <div id="raw-section" hidden>
          <h2>Raw Jev response</h2>
          <pre id="raw"></pre>
        </div>
        </div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
